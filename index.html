<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Bay Vietnam Airlines - Sân Bay Tân Sơn Nhất (SGN)</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Chakra Petch', 'monospace'],
          },
          colors: {
            fids: {
              bg: '#050f19',
              card: '#0a1928',
              header: '#030a12',
              rowEven: '#081523',
              rowOdd: '#0b1d30',
              border: '#15304b',
              vnaBlue: '#005574',
              vnaGold: '#e2b343',
              vnaGoldLight: '#f5c862',
              gateBg: '#0f273d'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Hiệu ứng nhấp nháy phát sáng chuẩn FIDS cho chuyến bay BOARDING */
    @keyframes fidsBoardingPulse {
      0%, 100% {
        background-color: #f59e0b;
        color: #000000;
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
      }
      50% {
        background-color: #fbbf24;
        color: #000000;
        box-shadow: 0 0 24px rgba(251, 191, 36, 0.9);
      }
    }
    .fids-badge-boarding {
      animation: fidsBoardingPulse 1.1s ease-in-out infinite;
    }

    @keyframes fidsRowBlink {
      0%, 100% { background-color: rgba(245, 158, 11, 0.08); }
      50% { background-color: rgba(245, 158, 11, 0.22); }
    }
    .boarding-row-blink {
      animation: fidsRowBlink 1.1s ease-in-out infinite;
    }

    /* Thanh cuộn FIDS siêu mỏng tối màu */
    .custom-table-scroll::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    .custom-table-scroll::-webkit-scrollbar-track {
      background: #050f19;
    }
    .custom-table-scroll::-webkit-scrollbar-thumb {
      background-color: #1e3a5a;
      border-radius: 4px;
    }
    .custom-table-scroll::-webkit-scrollbar-thumb:hover {
      background-color: #e2b343;
    }
  </style>
</head>
<body class="bg-fids-bg min-h-screen text-slate-100 font-sans antialiased selection:bg-fids-vnaGold selection:text-black">

  <!-- KHUNG ĐẦU TRANG ĐƯỢC GHIM CỐ ĐỊNH (FREEZE STICKY TOP) -->
  <div class="sticky top-0 z-50 shadow-2xl border-b border-fids-border">
    
    <!-- 1. Header chính đậm chất buồng lái & VNA Heritage -->
    <header class="bg-fids-header text-white border-b-2 border-fids-vnaGold px-4 py-2.5 sm:px-6">
      <div class="max-w-7xl mx-auto sm:flex sm:items-center sm:justify-between">
        <div class="flex items-center space-x-3.5">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-fids-vnaBlue to-slate-900 border border-fids-vnaGold/40 flex items-center justify-center shadow-inner">
            <i class="fa-solid fa-plane-departure text-fids-vnaGold text-lg"></i>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <h1 class="text-lg sm:text-xl font-extrabold tracking-wider text-white uppercase font-mono">SGN FLIGHT MONITOR</h1>
              <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-fids-vnaGold text-black font-mono tracking-wide">FIDS</span>
            </div>
            <p class="text-[11px] text-sky-300 font-medium tracking-wide">VIETNAM AIRLINES • TÂN SƠN NHẤT (SGN) • VIAGS & FLIGHTRADAR24</p>
          </div>
        </div>
        
        <!-- Cụm nút Thao tác & Auto-Pilot FIDS -->
        <div class="mt-2.5 sm:mt-0 flex flex-wrap items-center gap-2">
          <!-- Nút 1: Cập nhật VIAGS (D) -->
          <button id="btnRefresh" onclick="triggerRefreshToday(false)" class="inline-flex items-center px-3 py-1.5 rounded-md text-xs font-bold bg-fids-vnaGold text-slate-950 hover:bg-fids-vnaGoldLight active:scale-95 transition shadow cursor-pointer font-mono">
            <i id="refreshIcon" class="fa-solid fa-arrows-rotate mr-1.5 text-xs"></i>
            <span id="refreshText">VIAGS (D)</span>
          </button>

          <!-- Nút 2: Cập nhật FR24 -->
          <button id="btnRefreshFR24" onclick="triggerRefreshFR24(false)" class="inline-flex items-center px-3 py-1.5 rounded-md text-xs font-bold bg-[#0d2135] text-amber-300 border border-amber-400/50 hover:bg-[#14324f] hover:text-white active:scale-95 transition shadow cursor-pointer font-mono">
            <i id="refreshIconFR24" class="fa-solid fa-radar mr-1.5 text-xs"></i>
            <span id="refreshTextFR24">RADAR FR24</span>
          </button>

          <!-- Nút 3: Cập nhật STATUS -->
          <button id="btnRefreshStatus" onclick="triggerRefreshStatus(false)" class="inline-flex items-center px-3 py-1.5 rounded-md text-xs font-bold bg-sky-900 text-sky-200 border border-sky-500/40 hover:bg-sky-800 hover:text-white active:scale-95 transition shadow cursor-pointer font-mono">
            <i id="refreshIconStatus" class="fa-solid fa-clock mr-1.5 text-xs"></i>
            <span id="refreshTextStatus">STATUS (1m)</span>
          </button>

          <!-- Nút 4: Công tắc Tự động Auto-Pilot -->
          <button id="btnAutoPilot" onclick="toggleAutoPilot()" title="Tự động: STATUS 1m, FR24 3m, VIAGS 10m" class="inline-flex items-center px-3 py-1.5 rounded-md text-xs font-semibold bg-emerald-950/60 text-emerald-400 border border-emerald-500/40 hover:bg-emerald-900/40 active:scale-95 transition cursor-pointer font-mono">
            <span id="autoPilotDot" class="w-2 h-2 mr-1.5 bg-emerald-400 rounded-full animate-pulse shadow-[0_0_8px_#34d399]"></span>
            <span id="autoPilotText">AUTO: ON</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 2. Thanh điều khiển Bộ lọc phong cách FIDS tối màu -->
    <div class="bg-fids-card/95 backdrop-blur px-4 py-2 sm:px-6">
      <div class="max-w-7xl mx-auto">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 items-end">
          
          <!-- Chọn ngày -->
          <div>
            <label class="block text-[11px] font-bold text-sky-300 uppercase tracking-wider mb-1 font-mono">
              <i class="fa-regular fa-calendar-days text-fids-vnaGold mr-1"></i> DATE:
            </label>
            <input type="date" id="datePicker" class="w-full px-2.5 py-1 bg-fids-bg border border-fids-border rounded text-sm font-mono text-white focus:border-fids-vnaGold focus:ring-1 focus:ring-fids-vnaGold focus:outline-none transition">
          </div>

          <!-- TYPE: DOM | INTL -->
          <div>
            <label class="block text-[11px] font-bold text-sky-300 uppercase tracking-wider mb-1 font-mono">
              <i class="fa-solid fa-globe text-fids-vnaGold mr-1"></i> TYPE:
            </label>
            <div class="grid grid-cols-2 gap-1 bg-fids-bg p-0.5 rounded border border-fids-border">
              <button onclick="setType('Domestic')" id="btn-type-Domestic" class="type-btn py-1 text-xs font-bold rounded transition text-slate-300 hover:text-white cursor-pointer font-mono">DOM</button>
              <button onclick="setType('International')" id="btn-type-International" class="type-btn py-1 text-xs font-bold rounded transition text-slate-300 hover:text-white cursor-pointer font-mono">INTL</button>
            </div>
          </div>

          <!-- BOUND: DEP | ARR -->
          <div>
            <label class="block text-[11px] font-bold text-sky-300 uppercase tracking-wider mb-1 font-mono">
              <i class="fa-solid fa-arrows-split-up-and-left text-fids-vnaGold mr-1"></i> BOUND:
            </label>
            <div class="grid grid-cols-2 gap-1 bg-fids-bg p-0.5 rounded border border-fids-border">
              <button onclick="setDirection('Departure')" id="btn-dir-Departure" class="dir-btn py-1 text-xs font-bold rounded transition text-slate-300 hover:text-white cursor-pointer font-mono">DEP</button>
              <button onclick="setDirection('Arrival')" id="btn-dir-Arrival" class="dir-btn py-1 text-xs font-bold rounded transition text-slate-300 hover:text-white cursor-pointer font-mono">ARR</button>
            </div>
          </div>

          <!-- Tìm kiếm -->
          <div>
            <label class="block text-[11px] font-bold text-sky-300 uppercase tracking-wider mb-1 font-mono">
              <i class="fa-solid fa-magnifying-glass text-fids-vnaGold mr-1"></i> SEARCH:
            </label>
            <input type="text" id="searchInput" placeholder="VN205, HAN, HUE..." class="w-full px-2.5 py-1 bg-fids-bg border border-fids-border rounded text-sm text-white placeholder-slate-500 font-mono focus:border-fids-vnaGold focus:ring-1 focus:ring-fids-vnaGold focus:outline-none transition">
          </div>

        </div>
      </div>
    </div>

  </div>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 py-3.5">

    <!-- Thống kê nhanh FIDS -->
    <div class="flex items-center justify-between mb-2 px-1 text-xs font-mono">
      <div class="text-slate-300 flex items-center space-x-2">
        <span>TOTAL: <strong id="flightCount" class="text-fids-vnaGold text-sm">0</strong> FLIGHTS</span>
        <span class="text-slate-600">|</span>
        <span class="text-slate-400">SHIFT: 03:00 D &rarr; 02:59 D+1</span>
      </div>
      <div id="loadingStatus" class="text-sky-400 flex items-center">
        <i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i> SYNCING...
      </div>
    </div>

    <!-- BẢNG FIDS ĐIỆN TỬ SÂN BAY CHỐNG MỎI MẮT -->
    <div class="bg-fids-card rounded-xl border border-fids-border overflow-hidden shadow-2xl">
      <div class="overflow-x-auto overflow-y-auto max-h-[calc(100vh-190px)] custom-table-scroll">
        <table class="w-full text-left border-collapse">
          <thead id="flightsTableHead">
            <!-- Header chuẩn FIDS, ghim cố định và highlight -->
          </thead>
          <tbody id="flightsTableBody" class="text-sm">
            <!-- Render danh sách FIDS -->
          </tbody>
        </table>
      </div>
      <div id="emptyMessage" class="hidden p-12 text-center text-slate-500 font-mono">
        <i class="fa-solid fa-plane-slash text-4xl mb-3 text-slate-600"></i>
        <p class="font-bold">NO MATCHING FLIGHTS FOUND.</p>
      </div>
    </div>

  </main>

  <!-- Firebase Realtime Database Web SDK & FIDS Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCg4sWBwEwhgaIrNMKVPfCNN7mastS_Kko",
      authDomain: "sgn-flight-status.firebaseapp.com",
      databaseURL: "https://sgn-flight-status-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sgn-flight-status",
      storageBucket: "sgn-flight-status.firebasestorage.app",
      messagingSenderId: "141073829827",
      appId: "1:141073829827:web:6c61bce7519e300b727776"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    let currentType = localStorage.getItem('vna_selected_type') || 'Domestic';
    let currentDirection = localStorage.getItem('vna_selected_bound') || 'Departure';
    let autoPilotEnabled = localStorage.getItem('vna_autopilot_enabled') !== 'false';
    
    let rawFlights = [];
    let isInitialLoad = true;
    let selectedDate = '';
    let nextDateStr = '';

    // Khóa chống xung đột lệnh
    let isTodayUpdating = false;
    let isFR24Updating = false;
    let isStatusUpdating = false;

    // Ngăn 1: VIAGS (daily_schedules)
    let unsubViags1 = null;
    let unsubViags2 = null;
    let flightsDay1 = [];
    let flightsDay2 = [];

    // Ngăn 2: Flightradar24 (fr24_etas)
    let unsubFr24_1 = null;
    let unsubFr24_2 = null;
    let fr24MapDay1 = {};
    let fr24MapDay2 = {};

    // Ngăn 3: Live Statuses (live_statuses)
    let unsubStatus1 = null;
    let unsubStatus2 = null;
    let liveStatusMapDay1 = {};
    let liveStatusMapDay2 = {};

    const datePicker = document.getElementById('datePicker');
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    
    const rememberedDate = localStorage.getItem('vna_selected_date') || todayStr;
    datePicker.value = rememberedDate;

    function updateButtonUI() {
      // Style nút Type
      document.querySelectorAll('.type-btn').forEach(b => {
        b.className = 'type-btn py-1 text-xs font-bold rounded transition text-slate-400 hover:text-white cursor-pointer font-mono';
      });
      const activeTypeBtn = document.getElementById(`btn-type-${currentType}`);
      if (activeTypeBtn) {
        activeTypeBtn.className = 'type-btn py-1 text-xs font-extrabold rounded transition bg-fids-vnaBlue text-white shadow-sm border border-fids-vnaGold/40 cursor-pointer font-mono';
      }

      // Style nút Bound
      document.querySelectorAll('.dir-btn').forEach(b => {
        b.className = 'dir-btn py-1 text-xs font-bold rounded transition text-slate-400 hover:text-white cursor-pointer font-mono';
      });
      const activeDirBtn = document.getElementById(`btn-dir-${currentDirection}`);
      if (activeDirBtn) {
        activeDirBtn.className = 'dir-btn py-1 text-xs font-extrabold rounded transition bg-fids-vnaBlue text-white shadow-sm border border-fids-vnaGold/40 cursor-pointer font-mono';
      }
    }

    function calculateNextDate(dateStr) {
      const parts = dateStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + 1);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function listenToFlights(chosenDate) {
      if (selectedDate !== chosenDate) {
        fr24MapDay1 = {};
        fr24MapDay2 = {};
        liveStatusMapDay1 = {};
        liveStatusMapDay2 = {};
      }
      selectedDate = chosenDate;
      nextDateStr = calculateNextDate(chosenDate);

      if (unsubViags1) unsubViags1();
      if (unsubViags2) unsubViags2();
      if (unsubFr24_1) unsubFr24_1();
      if (unsubFr24_2) unsubFr24_2();
      if (unsubStatus1) unsubStatus1();
      if (unsubStatus2) unsubStatus2();

      document.getElementById('loadingStatus').classList.remove('hidden');

      // 1. VIAGS (daily_schedules)
      unsubViags1 = onValue(ref(rtdb, `daily_schedules/${selectedDate}`), (snap1) => {
        const val1 = snap1.val();
        flightsDay1 = (val1 && Array.isArray(val1.flights)) ? val1.flights : [];
        combineAndRender();
      }, () => {
        document.getElementById('loadingStatus').classList.add('hidden');
      });

      unsubViags2 = onValue(ref(rtdb, `daily_schedules/${nextDateStr}`), (snap2) => {
        const val2 = snap2.val();
        flightsDay2 = (val2 && Array.isArray(val2.flights)) ? val2.flights : [];
        combineAndRender();
      }, () => {});

      // 2. Flightradar24 (fr24_etas)
      unsubFr24_1 = onValue(ref(rtdb, `fr24_etas/${selectedDate}`), (frSnap1) => {
        fr24MapDay1 = { ...fr24MapDay1, ...(frSnap1.val() || {}) };
        renderFlights(false);
      }, () => {});

      unsubFr24_2 = onValue(ref(rtdb, `fr24_etas/${nextDateStr}`), (frSnap2) => {
        fr24MapDay2 = { ...fr24MapDay2, ...(frSnap2.val() || {}) };
        renderFlights(false);
      }, () => {});

      // 3. Live Status (live_statuses)
      unsubStatus1 = onValue(ref(rtdb, `live_statuses/${selectedDate}`), (stSnap1) => {
        liveStatusMapDay1 = { ...liveStatusMapDay1, ...(stSnap1.val() || {}) };
        renderFlights(false);
      }, () => {});

      unsubStatus2 = onValue(ref(rtdb, `live_statuses/${nextDateStr}`), (stSnap2) => {
        liveStatusMapDay2 = { ...liveStatusMapDay2, ...(stSnap2.val() || {}) };
        renderFlights(false);
      }, () => {});
    }

    function combineAndRender() {
      rawFlights = [...flightsDay1, ...flightsDay2];
      document.getElementById('loadingStatus').classList.add('hidden');
      renderFlights(true);
    }

    function getIndependentFr24Eta(flightObj) {
      const fNo = (flightObj.flight_no || '').replace(/\s+/g, '').toUpperCase();
      const mapToUse = (flightObj.date === selectedDate) ? fr24MapDay1 : fr24MapDay2;
      if (mapToUse && mapToUse[fNo] && mapToUse[fNo] !== '--') {
        return mapToUse[fNo];
      }
      return '--';
    }

    function getPriorityStatus(flightObj) {
      const fNo = (flightObj.flight_no || '').replace(/\s+/g, '').toUpperCase();
      const mapToUse = (flightObj.date === selectedDate) ? liveStatusMapDay1 : liveStatusMapDay2;
      if (mapToUse && mapToUse[fNo]) {
        return mapToUse[fNo];
      }
      return flightObj.remarks || 'Normal';
    }

    // Helper: Tạo Badge Trạng thái chuẩn FIDS như 2 hình mẫu
    function formatFidsStatusBadge(statusText) {
      const s = (statusText || 'NORMAL').trim().toUpperCase();
      
      if (s.includes('BOARDING')) {
        return `<span class="fids-badge-boarding inline-block px-2.5 py-1 rounded text-xs font-black tracking-wider uppercase font-mono shadow-md">BOARDING</span>`;
      }
      if (s.includes('CLOSING')) {
        return `<span class="inline-block px-2.5 py-1 rounded text-xs font-black bg-rose-600 text-white tracking-wider uppercase font-mono shadow">GATE CLOSING</span>`;
      }
      if (s.includes('GATE OPEN') || s.includes('OPEN') || s.includes('CHECK-IN')) {
        return `<span class="inline-block px-2.5 py-1 rounded text-xs font-extrabold bg-[#e2b343] text-black tracking-wider uppercase font-mono shadow">GATE OPEN</span>`;
      }
      if (s.includes('DEPARTED')) {
        return `<span class="inline-block px-2.5 py-1 rounded text-xs font-extrabold bg-emerald-500 text-slate-950 tracking-wider uppercase font-mono shadow">DEPARTED</span>`;
      }
      if (s.includes('LANDED')) {
        return `<span class="inline-block px-2.5 py-1 rounded text-xs font-extrabold bg-emerald-500 text-slate-950 tracking-wider uppercase font-mono shadow">LANDED</span>`;
      }
      if (s.includes('LANDING') || s.includes('ARRIVING') || s.includes('APPROACH')) {
        return `<span class="inline-block px-2.5 py-1 rounded text-xs font-extrabold bg-sky-500 text-slate-950 tracking-wider uppercase font-mono shadow animate-pulse">LANDING</span>`;
      }
      if (s.includes('DELAY')) {
        return `<span class="inline-block px-2.5 py-1 rounded text-xs font-extrabold bg-rose-600 text-white tracking-wider uppercase font-mono shadow animate-pulse">DELAYED</span>`;
      }
      if (s.includes('WAITING')) {
        return `<span class="inline-block px-2.5 py-1 rounded text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 tracking-wider uppercase font-mono">WAITING</span>`;
      }
      return `<span class="inline-block px-2 py-0.5 rounded text-xs font-medium text-slate-400 border border-slate-700/60 uppercase font-mono">${statusText}</span>`;
    }

    function renderFlights(shouldScroll = false) {
      const searchKey = document.getElementById('searchInput').value.trim().toUpperCase();

      const filtered = rawFlights.filter(f => {
        const fNo = (f.flight_no || '').toUpperCase().trim();
        if (!fNo.startsWith("VN")) return false;

        const currentStatus = getPriorityStatus(f).toUpperCase();
        if (currentStatus.includes('CANCEL')) {
          return false;
        }

        const sched = f.scheduled || '';
        if (f.date === selectedDate) {
          if (sched < '03:00') return false;
        } else if (f.date === nextDateStr) {
          if (sched >= '03:00') return false;
        } else {
          return false;
        }

        const fDir = (f.direction || '').toUpperCase();
        const fType = (f.flight_type || '').toUpperCase();

        const matchDir = (fDir === currentDirection.toUpperCase());
        const matchType = (fType === currentType.toUpperCase());

        const matchSearch = !searchKey || 
          (f.flight_no && f.flight_no.toUpperCase().includes(searchKey)) ||
          (f.route && f.route.toUpperCase().includes(searchKey)) ||
          (f.destination_or_from && f.destination_or_from.toUpperCase().includes(searchKey));

        return matchDir && matchType && matchSearch;
      });

      filtered.sort((a, b) => {
        const prioA = (a.date === selectedDate) ? 0 : 1;
        const prioB = (b.date === selectedDate) ? 0 : 1;
        if (prioA !== prioB) return prioA - prioB;
        return (a.scheduled || '99:99').localeCompare(b.scheduled || '99:99');
      });

      document.getElementById('flightCount').innerText = filtered.length;

      // HEADER FIDS GHIM CỐ ĐỊNH & HIGHLIGHT ĐẬM NÉT
      const thead = document.getElementById('flightsTableHead');
      let headerHtml = '';

      if (currentDirection === 'Departure') {
        headerHtml = `
          <tr class="bg-fids-header text-sky-200 uppercase text-xs tracking-wider border-b-2 border-fids-vnaGold font-mono">
            <th class="py-3 px-4 font-bold sticky top-0 bg-fids-header z-20 text-fids-vnaGold">FLIGHT</th>
            <th class="py-3 px-4 font-bold sticky top-0 bg-fids-header z-20 text-white">DESTINATION</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-fids-header z-20">STD</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-fids-header z-20">ETD</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-fids-header z-20 text-amber-300">GATE</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-fids-header z-20 text-white">STATUS</th>
          </tr>
        `;
      } else {
        headerHtml = `
          <tr class="bg-fids-header text-sky-200 uppercase text-xs tracking-wider border-b-2 border-fids-vnaGold font-mono">
            <th class="py-3 px-4 font-bold sticky top-0 bg-fids-header z-20 text-fids-vnaGold">FLIGHT</th>
            <th class="py-3 px-4 font-bold sticky top-0 bg-fids-header z-20 text-white">FROM</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-fids-header z-20">STA</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-fids-header z-20">ETA</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-fids-header z-20 text-amber-300">FLIGHTRADAR24</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-fids-header z-20">BELT</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-fids-header z-20 text-white">STATUS</th>
          </tr>
        `;
      }
      thead.innerHTML = headerHtml;

      // Tìm chuyến bay tiêu điểm
      const nowDate = new Date();
      const currentHHMM = String(nowDate.getHours()).padStart(2, '0') + ':' + String(nowDate.getMinutes()).padStart(2, '0');
      const isLateNight = currentHHMM < '03:00';
      
      let targetRowIndex = -1;

      if (currentDirection === 'Arrival') {
        for (let i = 0; i < filtered.length; i++) {
          const st = getPriorityStatus(filtered[i]).toUpperCase();
          if (st.includes('LANDING') || st.includes('ARRIVING') || st.includes('APPROACH')) {
            targetRowIndex = i;
            break;
          }
        }
        if (targetRowIndex === -1) {
          for (let i = 0; i < filtered.length; i++) {
            const frEta = getIndependentFr24Eta(filtered[i]);
            if (frEta && frEta !== '--') {
              targetRowIndex = i;
              break;
            }
          }
        }
      }

      if (targetRowIndex === -1) {
        for (let i = 0; i < filtered.length; i++) {
          const f = filtered[i];
          if (!isLateNight && f.date === selectedDate && (f.scheduled || '') >= currentHHMM) {
            targetRowIndex = i;
            break;
          } else if (isLateNight && f.date === nextDateStr && (f.scheduled || '') >= currentHHMM) {
            targetRowIndex = i;
            break;
          }
        }
        if (targetRowIndex === -1 && filtered.length > 0) {
          targetRowIndex = 0;
        }
      }

      // RENDER DANH SÁCH THEO PHONG CÁCH FIDS DARK THEME
      const tbody = document.getElementById('flightsTableBody');

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        document.getElementById('emptyMessage').classList.remove('hidden');
        return;
      }
      document.getElementById('emptyMessage').classList.add('hidden');

      let rowsHtml = '';
      filtered.forEach((f, idx) => {
        const isNextDayFlight = (f.date === nextDateStr);
        const isCurrentFocus = (idx === targetRowIndex);

        const finalStatus = getPriorityStatus(f);
        const remUpper = finalStatus.toUpperCase();
        const isBoarding = remUpper.includes('BOARDING');

        const flightNoClean = (f.flight_no || '').replace(/\s+/g, '');
        const cityName = f.route || f.destination_or_from || '--';

        // Màu nền xen kẽ (Zebra rows) chống mỏi mắt
        const zebraBg = (idx % 2 === 0) ? "bg-fids-rowEven" : "bg-fids-rowOdd";
        
        let trClass = `${zebraBg} hover:bg-[#122a42] transition-colors duration-150 border-b border-[#0f2438]`;
        if (isBoarding) {
          trClass = `boarding-row-blink border-l-4 border-l-amber-400 font-semibold border-b border-amber-500/30`;
        } else if (isCurrentFocus) {
          trClass = `bg-[#142c44] border-l-4 border-l-fids-vnaGold border-b border-fids-vnaGold/30 font-semibold`;
        }

        const trId = isCurrentFocus ? 'id="currentFocusFlight"' : '';
        const timeBadge = isNextDayFlight 
          ? `<span class="text-[10px] text-sky-400 font-bold ml-1 font-mono">(+1)</span>` 
          : '';

        const independentEta = getIndependentFr24Eta(f);
        let fr24Cell = '';
        if (independentEta !== '--') {
          fr24Cell = `
            <div class="flex items-center justify-center space-x-2">
              <span class="font-mono font-extrabold text-sky-300 bg-sky-950/80 px-2.5 py-0.5 rounded border border-sky-400/50 text-xs tracking-wider shadow-[0_0_8px_rgba(56,189,248,0.2)]">
                ${independentEta}
              </span>
              <a href="https://www.flightradar24.com/data/flights/${flightNoClean}" target="_blank" rel="noopener noreferrer" title="Mở Flightradar24" class="text-amber-400 hover:text-white transition">
                <i class="fa-solid fa-radar text-xs"></i>
              </a>
            </div>
          `;
        } else {
          fr24Cell = `
            <a href="https://www.flightradar24.com/data/flights/${flightNoClean}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center px-2 py-0.5 text-[11px] font-bold rounded bg-slate-900 text-amber-400/90 border border-slate-700 hover:bg-black hover:text-amber-300 transition shadow font-mono">
              <i class="fa-solid fa-radar mr-1 text-[10px]"></i> RADAR
            </a>
          `;
        }

        const statusBadgeHtml = formatFidsStatusBadge(finalStatus);

        // Hiển thị giờ chênh lệch ETD/ETA nổi bật màu cam
        const isTimeDiff = f.estimated && f.estimated !== '--:--' && f.estimated !== f.scheduled;
        const estColorClass = isTimeDiff ? "text-amber-400 font-bold" : "text-slate-300";

        if (currentDirection === 'Departure') {
          // BẢNG BAY ĐI (DEP)
          rowsHtml += `
            <tr ${trId} class="${trClass}">
              <td class="py-3 px-4 font-extrabold text-sky-300 font-mono tracking-wide whitespace-nowrap">${f.flight_no}</td>
              <td class="py-3 px-4 font-extrabold text-white uppercase tracking-wide whitespace-nowrap">${cityName}</td>
              <td class="py-3 px-4 text-center font-mono font-bold text-fids-vnaGold whitespace-nowrap">${f.scheduled || '--:--'}${timeBadge}</td>
              <td class="py-3 px-4 text-center font-mono font-semibold ${estColorClass} whitespace-nowrap">${f.estimated || '--:--'}</td>
              <td class="py-3 px-4 text-center whitespace-nowrap">
                <span class="px-2.5 py-1 bg-fids-gateBg text-amber-300 font-mono font-extrabold text-xs rounded border border-amber-400/30">${f.gate || '--'}</span>
              </td>
              <td class="py-3 px-4 text-center whitespace-nowrap">${statusBadgeHtml}</td>
            </tr>
          `;
        } else {
          // BẢNG BAY ĐẾN (ARR)
          rowsHtml += `
            <tr ${trId} class="${trClass}">
              <td class="py-3 px-4 font-extrabold text-sky-300 font-mono tracking-wide whitespace-nowrap">${f.flight_no}</td>
              <td class="py-3 px-4 font-extrabold text-white uppercase tracking-wide whitespace-nowrap">${cityName}</td>
              <td class="py-3 px-4 text-center font-mono font-bold text-fids-vnaGold whitespace-nowrap">${f.scheduled || '--:--'}${timeBadge}</td>
              <td class="py-3 px-4 text-center font-mono font-semibold ${estColorClass} whitespace-nowrap">${f.estimated || '--:--'}</td>
              <td class="py-3 px-4 text-center whitespace-nowrap">${fr24Cell}</td>
              <td class="py-3 px-4 text-center whitespace-nowrap">
                <span class="px-2.5 py-1 bg-fids-gateBg text-amber-300 font-mono font-extrabold text-xs rounded border border-amber-400/30">${f.belt || '--'}</span>
              </td>
              <td class="py-3 px-4 text-center whitespace-nowrap">${statusBadgeHtml}</td>
            </tr>
          `;
        }
      });

      tbody.innerHTML = rowsHtml;

      if (shouldScroll && isInitialLoad) {
        isInitialLoad = false;
        setTimeout(() => {
          const focusRow = document.getElementById('currentFocusFlight');
          if (focusRow) {
            focusRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 300);
      }
    }

    datePicker.addEventListener('change', (e) => {
      isInitialLoad = true;
      localStorage.setItem('vna_selected_date', e.target.value);
      listenToFlights(e.target.value);
    });

    document.getElementById('searchInput').addEventListener('input', () => renderFlights(false));

    window.setDirection = (dir) => {
      if (currentDirection === dir) return;
      currentDirection = dir;
      localStorage.setItem('vna_selected_bound', dir);
      updateButtonUI();
      renderFlights(false);
    };

    window.setType = (type) => {
      if (currentType === type) return;
      currentType = type;
      localStorage.setItem('vna_selected_type', type);
      updateButtonUI();
      renderFlights(false);
    };

    // 1. Nút Cập nhật hôm nay (VIAGS tổng)
    window.triggerRefreshToday = async (isSilent = false) => {
      const btn = document.getElementById('btnRefresh');
      const icon = document.getElementById('refreshIcon');
      const text = document.getElementById('refreshText');

      if (btn.disabled || isTodayUpdating) return;

      isTodayUpdating = true;
      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-not-allowed');
      icon.classList.add('fa-spin');
      text.innerText = 'Đang gửi...';

      try {
        const res = await fetch('/api/refresh', { method: 'POST' });
        const data = await res.json();

        if (res.ok) {
          let countdown = 80;
          const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
              text.innerText = `VIAGS... (${countdown}s)`;
            } else {
              clearInterval(timer);
              btn.disabled = false;
              isTodayUpdating = false;
              btn.classList.remove('opacity-75', 'cursor-not-allowed');
              icon.classList.remove('fa-spin');
              text.innerText = 'VIAGS (D)';
            }
          }, 1000);
        } else {
          if (!isSilent) alert('Lỗi: ' + (data.error || 'Không thể gửi lệnh'));
          btn.disabled = false;
          isTodayUpdating = false;
          btn.classList.remove('opacity-75', 'cursor-not-allowed');
          icon.classList.remove('fa-spin');
          text.innerText = 'VIAGS (D)';
        }
      } catch (err) {
        if (!isSilent) alert('Lỗi kết nối máy chủ!');
        btn.disabled = false;
        isTodayUpdating = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        icon.classList.remove('fa-spin');
        text.innerText = 'VIAGS (D)';
      }
    };

    // 2. Nút Cập nhật độc lập Flightradar24 (Chu kỳ 3 phút)
    window.triggerRefreshFR24 = async (isSilent = false) => {
      const btn = document.getElementById('btnRefreshFR24');
      const icon = document.getElementById('refreshIconFR24');
      const text = document.getElementById('refreshTextFR24');

      if (btn.disabled || isFR24Updating) return;

      isFR24Updating = true;
      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-not-allowed');
      icon.classList.add('fa-spin');
      text.innerText = 'Đang gửi...';

      try {
        const res = await fetch('/api/refresh-fr24', { method: 'POST' });
        const data = await res.json();

        if (res.ok) {
          let countdown = 25;
          const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
              text.innerText = `FR24... (${countdown}s)`;
            } else {
              clearInterval(timer);
              btn.disabled = false;
              isFR24Updating = false;
              btn.classList.remove('opacity-75', 'cursor-not-allowed');
              icon.classList.remove('fa-spin');
              text.innerText = 'RADAR FR24';
            }
          }, 1000);
        } else {
          if (!isSilent) alert('Lỗi: ' + (data.error || 'Không thể gửi lệnh'));
          btn.disabled = false;
          isFR24Updating = false;
          btn.classList.remove('opacity-75', 'cursor-not-allowed');
          icon.classList.remove('fa-spin');
          text.innerText = 'RADAR FR24';
        }
      } catch (err) {
        if (!isSilent) alert('Lỗi kết nối máy chủ!');
        btn.disabled = false;
        isFR24Updating = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        icon.classList.remove('fa-spin');
        text.innerText = 'RADAR FR24';
      }
    };

    // 3. Nút Cập nhật STATUS (Chu kỳ 1 phút)
    window.triggerRefreshStatus = async (isSilent = false) => {
      const btn = document.getElementById('btnRefreshStatus');
      const icon = document.getElementById('refreshIconStatus');
      const text = document.getElementById('refreshTextStatus');

      if (btn.disabled || isStatusUpdating) return;

      isStatusUpdating = true;
      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-not-allowed');
      icon.classList.add('fa-spin');
      text.innerText = 'Đang gửi...';

      try {
        const res = await fetch('/api/refresh-status', { method: 'POST' });
        const data = await res.json();

        if (res.ok) {
          let countdown = 35;
          const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
              text.innerText = `STATUS (${countdown}s)`;
            } else {
              clearInterval(timer);
              btn.disabled = false;
              isStatusUpdating = false;
              btn.classList.remove('opacity-75', 'cursor-not-allowed');
              icon.classList.remove('fa-spin');
              text.innerText = 'STATUS (1m)';
            }
          }, 1000);
        } else {
          if (!isSilent) alert('Lỗi: ' + (data.error || 'Không thể gửi lệnh'));
          btn.disabled = false;
          isStatusUpdating = false;
          btn.classList.remove('opacity-75', 'cursor-not-allowed');
          icon.classList.remove('fa-spin');
          text.innerText = 'STATUS (1m)';
        }
      } catch (err) {
        if (!isSilent) alert('Lỗi kết nối máy chủ!');
        btn.disabled = false;
        isStatusUpdating = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        icon.classList.remove('fa-spin');
        text.innerText = 'STATUS (1m)';
      }
    };

    // 4. AUTO-PILOT ĐIỀU PHỐI 3 NHỊP: STATUS 1 PHÚT | FR24 3 PHÚT | VIAGS 10 PHÚT
    let autoSec = 0;

    function updateAutoPilotUI() {
      const btn = document.getElementById('btnAutoPilot');
      const dot = document.getElementById('autoPilotDot');
      const txt = document.getElementById('autoPilotText');

      if (autoPilotEnabled) {
        btn.className = "inline-flex items-center px-3 py-1.5 rounded-md text-xs font-semibold bg-emerald-950/60 text-emerald-400 border border-emerald-500/40 hover:bg-emerald-900/40 active:scale-95 transition cursor-pointer font-mono";
        dot.className = "w-2 h-2 mr-1.5 bg-emerald-400 rounded-full animate-pulse shadow-[0_0_8px_#34d399]";
        txt.innerText = "AUTO: ON";
      } else {
        btn.className = "inline-flex items-center px-3 py-1.5 rounded-md text-xs font-semibold bg-slate-900 text-slate-500 border border-slate-700 hover:bg-slate-800 active:scale-95 transition cursor-pointer font-mono";
        dot.className = "w-2 h-2 mr-1.5 bg-slate-600 rounded-full";
        txt.innerText = "AUTO: OFF";
      }
    }

    window.toggleAutoPilot = () => {
      autoPilotEnabled = !autoPilotEnabled;
      localStorage.setItem('vna_autopilot_enabled', autoPilotEnabled ? 'true' : 'false');
      updateAutoPilotUI();
    };

    setInterval(() => {
      if (!autoPilotEnabled) return;
      autoSec++;

      // Nhịp 1: Mỗi 1 phút (60 giây) -> Tự động quét STATUS ngày hôm nay
      if (autoSec % 60 === 0) {
        if (!isStatusUpdating) {
          window.triggerRefreshStatus(true);
        }
      }

      // Nhịp 2: Mỗi 3 phút (180 giây, lệch 20 giây) -> Tự động quét FR24
      if ((autoSec + 20) % 180 === 0) {
        if (!isFR24Updating) {
          window.triggerRefreshFR24(true);
        }
      }

      // Nhịp 3: Mỗi 10 phút (600 giây, lệch 40 giây) -> Tự động quét VIAGS tổng
      if ((autoSec + 40) % 600 === 0) {
        if (!isTodayUpdating) {
          window.triggerRefreshToday(true);
        }
      }
    }, 1000);

    updateButtonUI();
    updateAutoPilotUI();
    listenToFlights(rememberedDate);
  </script>
</body>
</html>
