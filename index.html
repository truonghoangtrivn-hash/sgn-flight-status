<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Bay Vietnam Airlines - Sân Bay Tân Sơn Nhất (SGN)</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vna: {
              blue: '#005574',
              dark: '#002d42',
              gold: '#e2b343',
              light: '#f0f7fa'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Hiệu ứng nhấp nháy phát sáng toàn hàng cho chuyến bay BOARDING */
    @keyframes boardingPulse {
      0%, 100% {
        background-color: rgba(254, 240, 138, 0.4);
      }
      50% {
        background-color: rgba(250, 204, 21, 0.9);
      }
    }
    .boarding-row-blink {
      animation: boardingPulse 1.2s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- KHUNG ĐẦU TRANG ĐƯỢC GHIM CỐ ĐỊNH (FREEZE STICKY TOP) -->
  <div class="sticky top-0 z-50 shadow-md">
    
    <!-- 1. Header chính -->
    <header class="bg-vna-dark text-white border-b-4 border-vna-gold">
      <div class="max-w-7xl mx-auto px-4 py-3 sm:flex sm:items-center sm:justify-between">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-plane-departure text-vna-gold text-2xl sm:text-3xl"></i>
          <div>
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight">SGN FLIGHT MONITOR</h1>
            <p class="text-xs text-sky-200">Vietnam Airlines • Tân Sơn Nhất (SGN) • Dữ liệu VIAGS & Flightradar24</p>
          </div>
        </div>
        
        <!-- Cụm nút Cập Nhật & Trạng thái -->
        <div class="mt-2 sm:mt-0 flex items-center space-x-2">
          <!-- Nút Cập nhật hôm nay (VIAGS) -->
          <button id="btnRefresh" onclick="triggerRefreshToday()" class="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-bold bg-vna-gold text-slate-900 hover:bg-yellow-400 active:scale-95 transition shadow-sm cursor-pointer">
            <i id="refreshIcon" class="fa-solid fa-arrows-rotate mr-1.5"></i>
            <span id="refreshText">Cập nhật hôm nay (D)</span>
          </button>

          <!-- Nút Cập nhật độc lập Flightradar24 -->
          <button id="btnRefreshFR24" onclick="triggerRefreshFR24()" class="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-yellow-400 hover:bg-black active:scale-95 transition shadow-sm border border-yellow-500/40 cursor-pointer">
            <i id="refreshIconFR24" class="fa-solid fa-radar mr-1.5"></i>
            <span id="refreshTextFR24">Cập nhật FR24</span>
          </button>

          <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
            <span class="w-2 h-2 mr-2 bg-emerald-400 rounded-full animate-pulse"></span> Tự động
          </span>
        </div>
      </div>
    </header>

    <!-- 2. Thanh điều khiển Bộ lọc -->
    <div class="bg-white/95 backdrop-blur border-b border-slate-200">
      <div class="max-w-7xl mx-auto px-4 py-3">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 items-end">
          
          <!-- Chọn ngày (GHI NHỚ VĨNH VIỄN) -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
              <i class="fa-regular fa-calendar-days text-vna-blue mr-1"></i> Chọn ngày bay:
            </label>
            <input type="date" id="datePicker" class="w-full px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium focus:ring-2 focus:ring-vna-blue focus:outline-none transition">
          </div>

          <!-- TYPE: DOM | INTL -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
              <i class="fa-solid fa-globe text-vna-blue mr-1"></i> Type:
            </label>
            <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-lg">
              <button onclick="setType('Domestic')" id="btn-type-Domestic" class="type-btn py-1.5 text-xs font-bold rounded transition bg-vna-blue text-white shadow-sm cursor-pointer">DOM</button>
              <button onclick="setType('International')" id="btn-type-International" class="type-btn py-1.5 text-xs font-bold rounded transition text-slate-600 hover:bg-white cursor-pointer">INTL</button>
            </div>
          </div>

          <!-- BOUND: DEP | ARR -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
              <i class="fa-solid fa-arrows-split-up-and-left text-vna-blue mr-1"></i> Bound:
            </label>
            <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-lg">
              <button onclick="setDirection('Departure')" id="btn-dir-Departure" class="dir-btn py-1.5 text-xs font-bold rounded transition bg-vna-blue text-white shadow-sm cursor-pointer">DEP</button>
              <button onclick="setDirection('Arrival')" id="btn-dir-Arrival" class="dir-btn py-1.5 text-xs font-bold rounded transition text-slate-600 hover:bg-white cursor-pointer">ARR</button>
            </div>
          </div>

          <!-- Tìm kiếm -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
              <i class="fa-solid fa-magnifying-glass text-vna-blue mr-1"></i> Tìm kiếm:
            </label>
            <input type="text" id="searchInput" placeholder="VN205, HAN, HUE..." class="w-full px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium focus:ring-2 focus:ring-vna-blue focus:outline-none transition">
          </div>

        </div>
      </div>
    </div>

  </div>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-5">

    <!-- Thống kê nhanh & Trạng thái tải -->
    <div class="flex items-center justify-between mb-3 px-1">
      <div class="text-sm font-semibold text-slate-600">
        Hiển thị: <span id="flightCount" class="text-vna-blue font-bold text-lg">0</span> chuyến bay (Chu kỳ: 03:00 D &rarr; 02:59 D+1)
      </div>
      <div id="loadingStatus" class="text-sm text-slate-400 flex items-center">
        <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Đang tải dữ liệu...
      </div>
    </div>

    <!-- Bảng danh sách chuyến bay -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead id="flightsTableHead">
            <!-- Header chuẩn tiếng Anh theo Bound -->
          </thead>
          <tbody id="flightsTableBody" class="divide-y divide-slate-100 text-sm">
            <!-- Render dữ liệu -->
          </tbody>
        </table>
      </div>
      <div id="emptyMessage" class="hidden p-12 text-center text-slate-400">
        <i class="fa-solid fa-plane-slash text-4xl mb-3 text-slate-300"></i>
        <p class="font-medium">Chưa có dữ liệu cho ngày này. Hãy bấm nút "Cập nhật hôm nay (D)" ở góc trên bên phải để nạp dữ liệu vào kho mới!</p>
      </div>
    </div>

  </main>

  <!-- Firebase Realtime Database Web SDK (Không giới hạn 50K lượt đọc) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCg4sWBwEwhgaIrNMKVPfCNN7mastS_Kko",
      authDomain: "sgn-flight-status.firebaseapp.com",
      databaseURL: "https://sgn-flight-status-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sgn-flight-status",
      storageBucket: "sgn-flight-status.firebasestorage.app",
      messagingSenderId: "141073829827",
      appId: "1:141073829827:web:6c61bce7519e300b727776"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    let currentType = localStorage.getItem('vna_selected_type') || 'Domestic';
    let currentDirection = localStorage.getItem('vna_selected_bound') || 'Departure';
    
    let rawFlights = [];
    let isInitialLoad = true;
    let selectedDate = '';
    let nextDateStr = '';

    let unsubDoc1 = null;
    let unsubDoc2 = null;
    let flightsDay1 = [];
    let flightsDay2 = [];

    const datePicker = document.getElementById('datePicker');
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    
    const rememberedDate = localStorage.getItem('vna_selected_date') || todayStr;
    datePicker.value = rememberedDate;

    function updateButtonUI() {
      document.querySelectorAll('.type-btn').forEach(b => {
        b.className = 'type-btn py-1.5 text-xs font-bold rounded transition text-slate-600 hover:bg-white cursor-pointer';
      });
      const activeTypeBtn = document.getElementById(`btn-type-${currentType}`);
      if (activeTypeBtn) {
        activeTypeBtn.className = 'type-btn py-1.5 text-xs font-bold rounded transition bg-vna-blue text-white shadow-sm cursor-pointer';
      }

      document.querySelectorAll('.dir-btn').forEach(b => {
        b.className = 'dir-btn py-1.5 text-xs font-bold rounded transition text-slate-600 hover:bg-white cursor-pointer';
      });
      const activeDirBtn = document.getElementById(`btn-dir-${currentDirection}`);
      if (activeDirBtn) {
        activeDirBtn.className = 'dir-btn py-1.5 text-xs font-bold rounded transition bg-vna-blue text-white shadow-sm cursor-pointer';
      }
    }

    function calculateNextDate(dateStr) {
      const parts = dateStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + 1);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    // Lắng nghe dữ liệu trực tiếp từ Realtime Database
    function listenToFlights(chosenDate) {
      selectedDate = chosenDate;
      nextDateStr = calculateNextDate(chosenDate);

      if (unsubDoc1) unsubDoc1();
      if (unsubDoc2) unsubDoc2();

      document.getElementById('loadingStatus').classList.remove('hidden');

      // 1. Lắng nghe gói ngày D
      unsubDoc1 = onValue(ref(rtdb, `daily_schedules/${selectedDate}`), (snap1) => {
        const val1 = snap1.val();
        flightsDay1 = (val1 && Array.isArray(val1.flights)) ? val1.flights : [];
        combineAndRender();
      }, (err) => {
        console.error("Lỗi đọc Realtime Database:", err);
        document.getElementById('loadingStatus').classList.add('hidden');
      });

      // 2. Lắng nghe gói ngày D+1
      unsubDoc2 = onValue(ref(rtdb, `daily_schedules/${nextDateStr}`), (snap2) => {
        const val2 = snap2.val();
        flightsDay2 = (val2 && Array.isArray(val2.flights)) ? val2.flights : [];
        combineAndRender();
      }, () => {});
    }

    function combineAndRender() {
      rawFlights = [...flightsDay1, ...flightsDay2];
      document.getElementById('loadingStatus').classList.add('hidden');
      renderFlights(true);
    }

    function renderFlights(shouldScroll = false) {
      const searchKey = document.getElementById('searchInput').value.trim().toUpperCase();

      const filtered = rawFlights.filter(f => {
        const fNo = (f.flight_no || '').toUpperCase().trim();
        if (!fNo.startsWith("VN")) return false;

        const rem = (f.remarks || '').toUpperCase();
        if (rem.includes('CANCEL')) {
          return false;
        }

        // Ca khai thác: 03:00 D -> 02:59 D+1
        const sched = f.scheduled || '';
        if (f.date === selectedDate) {
          if (sched < '03:00') return false;
        } else if (f.date === nextDateStr) {
          if (sched >= '03:00') return false;
        } else {
          return false;
        }

        const fDir = (f.direction || '').toUpperCase();
        const fType = (f.flight_type || '').toUpperCase();

        const matchDir = (fDir === currentDirection.toUpperCase());
        const matchType = (fType === currentType.toUpperCase());

        const matchSearch = !searchKey || 
          (f.flight_no && f.flight_no.toUpperCase().includes(searchKey)) ||
          (f.route && f.route.toUpperCase().includes(searchKey)) ||
          (f.destination_or_from && f.destination_or_from.toUpperCase().includes(searchKey));

        return matchDir && matchType && matchSearch;
      });

      // Sắp xếp Scheduled
      filtered.sort((a, b) => {
        const prioA = (a.date === selectedDate) ? 0 : 1;
        const prioB = (b.date === selectedDate) ? 0 : 1;
        if (prioA !== prioB) return prioA - prioB;
        return (a.scheduled || '99:99').localeCompare(b.scheduled || '99:99');
      });

      document.getElementById('flightCount').innerText = filtered.length;

      // CẬP NHẬT HEADER
      const thead = document.getElementById('flightsTableHead');
      let headerHtml = '';

      if (currentDirection === 'Departure') {
        headerHtml = `
          <tr class="bg-slate-50 text-slate-500 uppercase text-xs tracking-wider border-b border-slate-200">
            <th class="py-3.5 px-4 font-bold">FLT NO.</th>
            <th class="py-3.5 px-4 font-bold">DEST</th>
            <th class="py-3.5 px-4 font-bold text-center">STD</th>
            <th class="py-3.5 px-4 font-bold text-center">ETD</th>
            <th class="py-3.5 px-4 font-bold text-center">GATE</th>
            <th class="py-3.5 px-4 font-bold text-center">STATUS</th>
          </tr>
        `;
      } else {
        headerHtml = `
          <tr class="bg-slate-50 text-slate-500 uppercase text-xs tracking-wider border-b border-slate-200">
            <th class="py-3.5 px-4 font-bold">FLT NO.</th>
            <th class="py-3.5 px-4 font-bold">FROM</th>
            <th class="py-3.5 px-4 font-bold text-center">STA</th>
            <th class="py-3.5 px-4 font-bold text-center">ETA</th>
            <th class="py-3.5 px-4 font-bold text-center">Flightradar24</th>
            <th class="py-3.5 px-4 font-bold text-center">BELT</th>
            <th class="py-3.5 px-4 font-bold text-center">STATUS</th>
          </tr>
        `;
      }
      thead.innerHTML = headerHtml;

      // Tìm chuyến bay tiêu điểm
      const nowDate = new Date();
      const currentHHMM = String(nowDate.getHours()).padStart(2, '0') + ':' + String(nowDate.getMinutes()).padStart(2, '0');
      const isLateNight = currentHHMM < '03:00';
      
      let targetRowIndex = -1;

      if (currentDirection === 'Arrival') {
        for (let i = 0; i < filtered.length; i++) {
          const rem = (filtered[i].remarks || '').toUpperCase();
          if (rem.includes('LANDING') || rem.includes('ARRIVING') || rem.includes('APPROACH')) {
            targetRowIndex = i;
            break;
          }
        }
        if (targetRowIndex === -1) {
          for (let i = 0; i < filtered.length; i++) {
            const frEta = filtered[i].fr24_eta;
            if (frEta && frEta !== '--') {
              targetRowIndex = i;
              break;
            }
          }
        }
      }

      if (targetRowIndex === -1) {
        for (let i = 0; i < filtered.length; i++) {
          const f = filtered[i];
          if (!isLateNight && f.date === selectedDate && (f.scheduled || '') >= currentHHMM) {
            targetRowIndex = i;
            break;
          } else if (isLateNight && f.date === nextDateStr && (f.scheduled || '') >= currentHHMM) {
            targetRowIndex = i;
            break;
          }
        }
        if (targetRowIndex === -1 && filtered.length > 0) {
          targetRowIndex = 0;
        }
      }

      // RENDER DỮ LIỆU
      const tbody = document.getElementById('flightsTableBody');

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        document.getElementById('emptyMessage').classList.remove('hidden');
        return;
      }
      document.getElementById('emptyMessage').classList.add('hidden');

      let rowsHtml = '';
      filtered.forEach((f, idx) => {
        const isNextDayFlight = (f.date === nextDateStr);
        const isCurrentFocus = (idx === targetRowIndex);

        const rem = (f.remarks || '').toUpperCase();
        const isBoarding = rem.includes('BOARDING');

        let badgeColor = "bg-slate-100 text-slate-700";
        if (rem.includes('DEPARTED') || rem.includes('ARRIVED') || rem.includes('LANDED')) {
          badgeColor = "bg-emerald-50 text-emerald-700 border border-emerald-200";
        } else if (rem.includes('DELAY') || rem.includes('WAITING')) {
          badgeColor = "bg-amber-50 text-amber-700 border border-amber-200";
        } else if (isBoarding || rem.includes('OPEN') || rem.includes('CHECK-IN')) {
          badgeColor = "bg-amber-100 text-amber-900 border border-amber-300 font-extrabold";
        }

        const flightNoClean = (f.flight_no || '').replace(/\s+/g, '');
        const cityName = f.route || f.destination_or_from || '--';

        let trClass = "hover:bg-slate-50/80 transition duration-150";
        if (isBoarding) {
          trClass = "boarding-row-blink border-l-4 border-l-amber-500 font-medium";
        } else if (isCurrentFocus) {
          trClass = "bg-amber-50/40 border-l-4 border-l-vna-gold hover:bg-slate-50/80 transition";
        }

        const trId = isCurrentFocus ? 'id="currentFocusFlight"' : '';
        const timeBadge = isNextDayFlight 
          ? `<span class="text-[11px] text-sky-600 font-semibold ml-1">(+1)</span>` 
          : '';

        let fr24Cell = '';
        if (f.fr24_eta && f.fr24_eta !== '--') {
          fr24Cell = `
            <div class="flex items-center justify-center space-x-1.5">
              <span class="font-mono font-bold text-sky-800 bg-sky-100 px-2.5 py-0.5 rounded border border-sky-300 text-xs shadow-xs" title="Giờ dự đáp (ETA) từ Flightradar24">
                ${f.fr24_eta}
              </span>
              <a href="https://www.flightradar24.com/data/flights/${flightNoClean}" target="_blank" rel="noopener noreferrer" title="Xem radar" class="inline-flex items-center p-1 rounded text-yellow-500 hover:text-yellow-600 hover:bg-slate-100 transition">
                <i class="fa-solid fa-radar text-xs"></i>
              </a>
            </div>
          `;
        } else {
          fr24Cell = `
            <a href="https://www.flightradar24.com/data/flights/${flightNoClean}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center px-2 py-1 text-xs font-semibold rounded bg-slate-900 text-yellow-400 hover:bg-black transition shadow-sm">
              <i class="fa-solid fa-radar mr-1 text-[10px]"></i> Radar Live
            </a>
          `;
        }

        if (currentDirection === 'Departure') {
          rowsHtml += `
            <tr ${trId} class="${trClass}">
              <td class="py-3 px-4 font-bold text-vna-blue whitespace-nowrap">${f.flight_no}</td>
              <td class="py-3 px-4 font-semibold text-slate-800 whitespace-nowrap">${cityName}</td>
              <td class="py-3 px-4 text-center font-mono font-bold text-slate-800 whitespace-nowrap">${f.scheduled || '--:--'}${timeBadge}</td>
              <td class="py-3 px-4 text-center font-mono font-semibold ${f.estimated && f.estimated !== f.scheduled ? 'text-amber-600' : 'text-slate-600'} whitespace-nowrap">${f.estimated || '--:--'}</td>
              <td class="py-3 px-4 text-center whitespace-nowrap"><span class="px-2 py-1 bg-slate-100 font-bold text-xs rounded border border-slate-200">${f.gate || '--'}</span></td>
              <td class="py-3 px-4 text-center whitespace-nowrap"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeColor}">${f.remarks || 'Normal'}</span></td>
            </tr>
          `;
        } else {
          rowsHtml += `
            <tr ${trId} class="${trClass}">
              <td class="py-3 px-4 font-bold text-vna-blue whitespace-nowrap">${f.flight_no}</td>
              <td class="py-3 px-4 font-semibold text-slate-800 whitespace-nowrap">${cityName}</td>
              <td class="py-3 px-4 text-center font-mono font-bold text-slate-800 whitespace-nowrap">${f.scheduled || '--:--'}${timeBadge}</td>
              <td class="py-3 px-4 text-center font-mono font-semibold ${f.estimated && f.estimated !== f.scheduled ? 'text-amber-600' : 'text-slate-600'} whitespace-nowrap">${f.estimated || '--:--'}</td>
              <td class="py-3 px-4 text-center whitespace-nowrap">${fr24Cell}</td>
              <td class="py-3 px-4 text-center whitespace-nowrap"><span class="px-2 py-1 bg-slate-100 font-bold text-xs rounded border border-slate-200">${f.belt || '--'}</span></td>
              <td class="py-3 px-4 text-center whitespace-nowrap"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeColor}">${f.remarks || 'Normal'}</span></td>
            </tr>
          `;
        }
      });

      tbody.innerHTML = rowsHtml;

      if (shouldScroll && isInitialLoad) {
        isInitialLoad = false;
        setTimeout(() => {
          const focusRow = document.getElementById('currentFocusFlight');
          if (focusRow) {
            focusRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 300);
      }
    }

    datePicker.addEventListener('change', (e) => {
      isInitialLoad = true;
      localStorage.setItem('vna_selected_date', e.target.value);
      listenToFlights(e.target.value);
    });

    document.getElementById('searchInput').addEventListener('input', () => renderFlights(false));

    window.setDirection = (dir) => {
      if (currentDirection === dir) return;
      currentDirection = dir;
      localStorage.setItem('vna_selected_bound', dir);
      updateButtonUI();
      renderFlights(false);
    };

    window.setType = (type) => {
      if (currentType === type) return;
      currentType = type;
      localStorage.setItem('vna_selected_type', type);
      updateButtonUI();
      renderFlights(false);
    };

    // Nút Cập nhật hôm nay (VIAGS)
    window.triggerRefreshToday = async () => {
      const btn = document.getElementById('btnRefresh');
      const icon = document.getElementById('refreshIcon');
      const text = document.getElementById('refreshText');

      if (btn.disabled) return;

      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-not-allowed');
      icon.classList.add('fa-spin');
      text.innerText = 'Đang gửi lệnh...';

      try {
        const res = await fetch('/api/refresh', { method: 'POST' });
        const data = await res.json();

        if (res.ok) {
          let countdown = 90;
          const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
              text.innerText = `Đang cào VIAGS... (${countdown}s)`;
            } else {
              clearInterval(timer);
              btn.disabled = false;
              btn.classList.remove('opacity-75', 'cursor-not-allowed');
              icon.classList.remove('fa-spin');
              text.innerText = 'Cập nhật hôm nay (D)';
            }
          }, 1000);
        } else {
          alert('Lỗi: ' + (data.error || 'Không thể gửi lệnh cập nhật'));
          btn.disabled = false;
          btn.classList.remove('opacity-75', 'cursor-not-allowed');
          icon.classList.remove('fa-spin');
          text.innerText = 'Cập nhật hôm nay (D)';
        }
      } catch (err) {
        alert('Lỗi kết nối máy chủ!');
        btn.disabled = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        icon.classList.remove('fa-spin');
        text.innerText = 'Cập nhật hôm nay (D)';
      }
    };

    // Nút Cập nhật độc lập Flightradar24
    window.triggerRefreshFR24 = async () => {
      const btn = document.getElementById('btnRefreshFR24');
      const icon = document.getElementById('refreshIconFR24');
      const text = document.getElementById('refreshTextFR24');

      if (btn.disabled) return;

      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-not-allowed');
      icon.classList.add('fa-spin');
      text.innerText = 'Đang gửi...';

      try {
        const res = await fetch('/api/refresh-fr24', { method: 'POST' });
        const data = await res.json();

        if (res.ok) {
          let countdown = 35;
          const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
              text.innerText = `Quét FR24... (${countdown}s)`;
            } else {
              clearInterval(timer);
              btn.disabled = false;
              btn.classList.remove('opacity-75', 'cursor-not-allowed');
              icon.classList.remove('fa-spin');
              text.innerText = 'Cập nhật FR24';
            }
          }, 1000);
        } else {
          alert('Lỗi: ' + (data.error || 'Không thể gửi lệnh'));
          btn.disabled = false;
          btn.classList.remove('opacity-75', 'cursor-not-allowed');
          icon.classList.remove('fa-spin');
          text.innerText = 'Cập nhật FR24';
        }
      } catch (err) {
        alert('Lỗi kết nối máy chủ!');
        btn.disabled = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        icon.classList.remove('fa-spin');
        text.innerText = 'Cập nhật FR24';
      }
    };

    updateButtonUI();
    listenToFlights(rememberedDate);
  </script>
