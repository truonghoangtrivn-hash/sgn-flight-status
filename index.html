<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Bay Vietnam Airlines - Sân Bay Tân Sơn Nhất (SGN)</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Chakra Petch', 'monospace'],
          },
          colors: {
            vna: {
              blue: '#005574',
              dark: '#002d42',
              navy: '#001e2e',
              gold: '#e2b343',
              goldLight: '#f5c862',
              cream: '#fdfbf7',
              lotusSoft: 'rgba(226, 179, 67, 0.16)'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Hiệu ứng thở êm dịu màu Vàng Hoa Sen VNA cho hàng BOARDING */
    @keyframes vnaLotusGlow {
      0%, 100% {
        background-color: rgba(226, 179, 67, 0.12);
      }
      50% {
        background-color: rgba(226, 179, 67, 0.28);
      }
    }
    .vna-boarding-row {
      animation: vnaLotusGlow 1.8s ease-in-out infinite;
      border-left: 4px solid #e2b343 !important;
    }

    /* Thanh cuộn mượt mà */
    .custom-table-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-table-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-table-scroll::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 4px;
    }
    .custom-table-scroll::-webkit-scrollbar-thumb:hover {
      background-color: #e2b343;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans antialiased selection:bg-vna-gold selection:text-vna-dark">

  <!-- KHUNG ĐẦU TRANG ĐƯỢC GHIM CỐ ĐỊNH (FREEZE STICKY TOP) -->
  <div class="sticky top-0 z-50 shadow-md">
    
    <!-- 1. Header chính mang bản sắc Vietnam Airlines -->
    <header class="bg-vna-dark text-white border-b-4 border-vna-gold px-4 py-3 sm:px-6">
      <div class="max-w-7xl mx-auto sm:flex sm:items-center sm:justify-between">
        <div class="flex items-center space-x-3.5">
          <div class="w-10 h-10 rounded-xl bg-vna-navy border border-vna-gold/40 flex items-center justify-center shadow-inner">
            <i class="fa-solid fa-plane-departure text-vna-gold text-xl"></i>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white font-mono">SGN FLIGHT MONITOR</h1>
              <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-vna-gold text-vna-dark font-mono tracking-wider">VNA</span>
            </div>
            <p class="text-xs text-sky-200 font-medium">Vietnam Airlines • Tân Sơn Nhất (SGN) • Dữ liệu VIAGS & Flightradar24</p>
          </div>
        </div>
        
        <!-- Cụm các nút Cập Nhật & Công tắc Tự động thông minh -->
        <div class="mt-2.5 sm:mt-0 flex flex-wrap items-center gap-2">
          <!-- Nút 1: Cập nhật hôm nay (VIAGS tổng) -->
          <button id="btnRefresh" onclick="triggerRefreshToday(false)" class="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-bold bg-vna-gold text-slate-900 hover:bg-vna-goldLight active:scale-95 transition shadow-sm cursor-pointer font-mono">
            <i id="refreshIcon" class="fa-solid fa-arrows-rotate mr-1.5 text-xs"></i>
            <span id="refreshText">VIAGS (D)</span>
          </button>

          <!-- Nút 2: Cập nhật độc lập Flightradar24 -->
          <button id="btnRefreshFR24" onclick="triggerRefreshFR24(false)" class="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-yellow-400 hover:bg-black active:scale-95 transition shadow-sm border border-yellow-500/40 cursor-pointer font-mono">
            <i id="refreshIconFR24" class="fa-solid fa-radar mr-1.5 text-xs"></i>
            <span id="refreshTextFR24">RADAR FR24</span>
          </button>

          <!-- Nút 3: Cập nhật riêng cột STATUS (1 phút/lần) -->
          <button id="btnRefreshStatus" onclick="triggerRefreshStatus(false)" class="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-bold bg-vna-blue text-white hover:bg-sky-800 active:scale-95 transition shadow-sm border border-white/20 cursor-pointer font-mono">
            <i id="refreshIconStatus" class="fa-solid fa-clock mr-1.5 text-xs"></i>
            <span id="refreshTextStatus">STATUS (1m)</span>
          </button>

          <!-- Nút 4: Công tắc Tự động thông minh 3 nhịp -->
          <button id="btnAutoPilot" onclick="toggleAutoPilot()" title="Tự động: STATUS mỗi 1 phút, FR24 mỗi 3 phút, VIAGS mỗi 10 phút" class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/30 active:scale-95 transition cursor-pointer font-mono">
            <span id="autoPilotDot" class="w-2 h-2 mr-2 bg-emerald-400 rounded-full animate-pulse shadow-[0_0_8px_#34d399]"></span>
            <span id="autoPilotText">Tự động: BẬT</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 2. Thanh điều khiển Bộ lọc phong cách trang nhã -->
    <div class="bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-2.5 sm:px-6">
      <div class="max-w-7xl mx-auto">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 items-end">
          
          <!-- Chọn ngày (GHI NHỚ VĨNH VIỄN) -->
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 font-mono">
              <i class="fa-regular fa-calendar-days text-vna-blue mr-1"></i> DATE:
            </label>
            <input type="date" id="datePicker" class="w-full px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium font-mono text-slate-800 focus:ring-2 focus:ring-vna-blue focus:border-vna-blue focus:outline-none transition">
          </div>

          <!-- TYPE: DOM | INTL -->
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 font-mono">
              <i class="fa-solid fa-globe text-vna-blue mr-1"></i> TYPE:
            </label>
            <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
              <button onclick="setType('Domestic')" id="btn-type-Domestic" class="type-btn py-1.5 text-xs font-bold rounded transition bg-vna-blue text-white shadow-sm cursor-pointer font-mono">DOM</button>
              <button onclick="setType('International')" id="btn-type-International" class="type-btn py-1.5 text-xs font-bold rounded transition text-slate-600 hover:bg-white cursor-pointer font-mono">INTL</button>
            </div>
          </div>

          <!-- BOUND: DEP | ARR -->
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 font-mono">
              <i class="fa-solid fa-arrows-split-up-and-left text-vna-blue mr-1"></i> BOUND:
            </label>
            <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
              <button onclick="setDirection('Departure')" id="btn-dir-Departure" class="dir-btn py-1.5 text-xs font-bold rounded transition bg-vna-blue text-white shadow-sm cursor-pointer font-mono">DEP</button>
              <button onclick="setDirection('Arrival')" id="btn-dir-Arrival" class="dir-btn py-1.5 text-xs font-bold rounded transition text-slate-600 hover:bg-white cursor-pointer font-mono">ARR</button>
            </div>
          </div>

          <!-- Tìm kiếm -->
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 font-mono">
              <i class="fa-solid fa-magnifying-glass text-vna-blue mr-1"></i> SEARCH:
            </label>
            <input type="text" id="searchInput" placeholder="VN205, HAN, HUE..." class="w-full px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium font-mono text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-vna-blue focus:border-vna-blue focus:outline-none transition">
          </div>

        </div>
      </div>
    </div>

  </div>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 py-4">

    <!-- Thống kê nhanh & Trạng thái tải -->
    <div class="flex items-center justify-between mb-2.5 px-1 font-mono text-xs">
      <div class="text-slate-600 font-semibold flex items-center space-x-2">
        <span>HIỂN THỊ: <strong id="flightCount" class="text-vna-blue text-sm font-bold">0</strong> CHUYẾN BAY</span>
        <span class="text-slate-300">|</span>
        <span class="text-slate-500">CA KHAI THÁC: 03:00 D &rarr; 02:59 D+1</span>
      </div>
      <div id="loadingStatus" class="text-sky-700 font-semibold flex items-center">
        <i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i> Đang đồng bộ...
      </div>
    </div>

    <!-- BẢNG DANH SÁCH CHUYẾN BAY VNA HERITAGE -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/90 overflow-hidden">
      <div class="overflow-x-auto overflow-y-auto max-h-[calc(100vh-215px)] custom-table-scroll">
        <table class="w-full text-left border-collapse">
          <thead id="flightsTableHead">
            <!-- Header chuẩn VNA Navy & Gold, ghim cố định trên đỉnh bảng -->
          </thead>
          <tbody id="flightsTableBody" class="divide-y divide-slate-100 text-sm">
            <!-- Render dữ liệu -->
          </tbody>
        </table>
      </div>
      <div id="emptyMessage" class="hidden p-12 text-center text-slate-400 font-mono">
        <i class="fa-solid fa-plane-slash text-4xl mb-3 text-slate-300"></i>
        <p class="font-bold">Không tìm thấy chuyến bay Vietnam Airlines nào khớp với bộ lọc.</p>
      </div>
    </div>

  </main>

  <!-- Firebase Realtime Database Web SDK & VNA Heritage Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCg4sWBwEwhgaIrNMKVPfCNN7mastS_Kko",
      authDomain: "sgn-flight-status.firebaseapp.com",
      databaseURL: "https://sgn-flight-status-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sgn-flight-status",
      storageBucket: "sgn-flight-status.firebasestorage.app",
      messagingSenderId: "141073829827",
      appId: "1:141073829827:web:6c61bce7519e300b727776"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    let currentType = localStorage.getItem('vna_selected_type') || 'Domestic';
    let currentDirection = localStorage.getItem('vna_selected_bound') || 'Departure';
    let autoPilotEnabled = localStorage.getItem('vna_autopilot_enabled') !== 'false';
    
    let rawFlights = [];
    let isInitialLoad = true;
    let selectedDate = '';
    let nextDateStr = '';

    // Khóa chống xung đột / dồn lệnh khi tự động quét
    let isTodayUpdating = false;
    let isFR24Updating = false;
    let isStatusUpdating = false;

    // Ngăn 1: Dữ liệu VIAGS (daily_schedules)
    let unsubViags1 = null;
    let unsubViags2 = null;
    let flightsDay1 = [];
    let flightsDay2 = [];

    // Ngăn 2: Dữ liệu độc lập Flightradar24 (fr24_etas)
    let unsubFr24_1 = null;
    let unsubFr24_2 = null;
    let fr24MapDay1 = {};
    let fr24MapDay2 = {};

    // Ngăn 3: DỮ LIỆU ĐỘC LẬP ƯU TIÊN SỐ 1 CỦA CỘT STATUS (live_statuses)
    let unsubStatus1 = null;
    let unsubStatus2 = null;
    let liveStatusMapDay1 = {};
    let liveStatusMapDay2 = {};

    const datePicker = document.getElementById('datePicker');
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    
    const rememberedDate = localStorage.getItem('vna_selected_date') || todayStr;
    datePicker.value = rememberedDate;

    function updateButtonUI() {
      document.querySelectorAll('.type-btn').forEach(b => {
        b.className = 'type-btn py-1.5 text-xs font-bold rounded transition text-slate-600 hover:bg-white cursor-pointer font-mono';
      });
      const activeTypeBtn = document.getElementById(`btn-type-${currentType}`);
      if (activeTypeBtn) {
        activeTypeBtn.className = 'type-btn py-1.5 text-xs font-bold rounded transition bg-vna-blue text-white shadow-sm cursor-pointer font-mono';
      }

      document.querySelectorAll('.dir-btn').forEach(b => {
        b.className = 'dir-btn py-1.5 text-xs font-bold rounded transition text-slate-600 hover:bg-white cursor-pointer font-mono';
      });
      const activeDirBtn = document.getElementById(`btn-dir-${currentDirection}`);
      if (activeDirBtn) {
        activeDirBtn.className = 'dir-btn py-1.5 text-xs font-bold rounded transition bg-vna-blue text-white shadow-sm cursor-pointer font-mono';
      }
    }

    function calculateNextDate(dateStr) {
      const parts = dateStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + 1);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    // Lắng nghe đồng thời cả 3 nhánh độc lập
    function listenToFlights(chosenDate) {
      if (selectedDate !== chosenDate) {
        fr24MapDay1 = {};
        fr24MapDay2 = {};
        liveStatusMapDay1 = {};
        liveStatusMapDay2 = {};
      }
      selectedDate = chosenDate;
      nextDateStr = calculateNextDate(chosenDate);

      if (unsubViags1) unsubViags1();
      if (unsubViags2) unsubViags2();
      if (unsubFr24_1) unsubFr24_1();
      if (unsubFr24_2) unsubFr24_2();
      if (unsubStatus1) unsubStatus1();
      if (unsubStatus2) unsubStatus2();

      document.getElementById('loadingStatus').classList.remove('hidden');

      // 1. Ngăn VIAGS (daily_schedules)
      unsubViags1 = onValue(ref(rtdb, `daily_schedules/${selectedDate}`), (snap1) => {
        const val1 = snap1.val();
        flightsDay1 = (val1 && Array.isArray(val1.flights)) ? val1.flights : [];
        combineAndRender();
      }, () => {
        document.getElementById('loadingStatus').classList.add('hidden');
      });

      unsubViags2 = onValue(ref(rtdb, `daily_schedules/${nextDateStr}`), (snap2) => {
        const val2 = snap2.val();
        flightsDay2 = (val2 && Array.isArray(val2.flights)) ? val2.flights : [];
        combineAndRender();
      }, () => {});

      // 2. Ngăn Flightradar24 (fr24_etas)
      unsubFr24_1 = onValue(ref(rtdb, `fr24_etas/${selectedDate}`), (frSnap1) => {
        fr24MapDay1 = { ...fr24MapDay1, ...(frSnap1.val() || {}) };
        renderFlights(false);
      }, () => {});

      unsubFr24_2 = onValue(ref(rtdb, `fr24_etas/${nextDateStr}`), (frSnap2) => {
        fr24MapDay2 = { ...fr24MapDay2, ...(frSnap2.val() || {}) };
        renderFlights(false);
      }, () => {});

      // 3. Ngăn Ưu Tiên Số 1 STATUS (live_statuses)
      unsubStatus1 = onValue(ref(rtdb, `live_statuses/${selectedDate}`), (stSnap1) => {
        liveStatusMapDay1 = { ...liveStatusMapDay1, ...(stSnap1.val() || {}) };
        renderFlights(false);
      }, () => {});

      unsubStatus2 = onValue(ref(rtdb, `live_statuses/${nextDateStr}`), (stSnap2) => {
        liveStatusMapDay2 = { ...liveStatusMapDay2, ...(stSnap2.val() || {}) };
        renderFlights(false);
      }, () => {});
    }

    function combineAndRender() {
      rawFlights = [...flightsDay1, ...flightsDay2];
      document.getElementById('loadingStatus').classList.add('hidden');
      renderFlights(true);
    }

    function getIndependentFr24Eta(flightObj) {
      const fNo = (flightObj.flight_no || '').replace(/\s+/g, '').toUpperCase();
      const mapToUse = (flightObj.date === selectedDate) ? fr24MapDay1 : fr24MapDay2;
      if (mapToUse && mapToUse[fNo] && mapToUse[fNo] !== '--') {
        return mapToUse[fNo];
      }
      return '--';
    }

    // LẤY TRẠNG THÁI ƯU TIÊN SỐ 1 CHO CỘT STATUS
    function getPriorityStatus(flightObj) {
      const fNo = (flightObj.flight_no || '').replace(/\s+/g, '').toUpperCase();
      const mapToUse = (flightObj.date === selectedDate) ? liveStatusMapDay1 : liveStatusMapDay2;
      if (mapToUse && mapToUse[fNo]) {
        return mapToUse[fNo];
      }
      return flightObj.remarks || 'Normal';
    }

    // ĐỊNH DẠNG BADGE TRẠNG THÁI VNA HERITAGE (GIỮ NGUYÊN VĂN 100% TỪNG CHỮ)
    function formatVnaStatusBadge(statusText) {
      const originalText = (statusText || 'Normal').trim();
      const upper = originalText.toUpperCase();

      // Giữ nguyên 100% nội dung chữ, phối màu trang nhã chuẩn VNA Heritage
      if (upper.includes('BOARDING')) {
        return `<span class="inline-block px-3 py-1 rounded-md text-xs font-bold bg-amber-100 text-amber-950 border border-amber-400 shadow-xs">${originalText}</span>`;
      }
      if (upper.includes('DEPARTED') || upper.includes('LANDED') || upper.includes('ARRIVED')) {
        return `<span class="inline-block px-3 py-1 rounded-md text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-300 shadow-2xs">${originalText}</span>`;
      }
      if (upper.includes('CHECK-IN')) {
        return `<span class="inline-block px-3 py-1 rounded-md text-xs font-semibold bg-amber-50 text-amber-900 border border-amber-300 shadow-2xs">${originalText}</span>`;
      }
      if (upper.includes('WAITING')) {
        return `<span class="inline-block px-3 py-1 rounded-md text-xs font-medium bg-amber-50/70 text-amber-800 border border-amber-200">${originalText}</span>`;
      }
      if (upper.includes('DELAY')) {
        return `<span class="inline-block px-3 py-1 rounded-md text-xs font-semibold bg-rose-50 text-rose-800 border border-rose-300 shadow-2xs">${originalText}</span>`;
      }
      if (upper.includes('LANDING') || upper.includes('APPROACH')) {
        return `<span class="inline-block px-3 py-1 rounded-md text-xs font-bold bg-sky-100 text-sky-900 border border-sky-400 shadow-xs animate-pulse">${originalText}</span>`;
      }
      return `<span class="inline-block px-3 py-1 rounded-md text-xs font-medium bg-slate-50 text-slate-700 border border-slate-200">${originalText}</span>`;
    }

    function renderFlights(shouldScroll = false) {
      const searchKey = document.getElementById('searchInput').value.trim().toUpperCase();

      const filtered = rawFlights.filter(f => {
        const fNo = (f.flight_no || '').toUpperCase().trim();
        if (!fNo.startsWith("VN")) return false;

        const currentStatus = getPriorityStatus(f).toUpperCase();
        if (currentStatus.includes('CANCEL')) {
          return false;
        }

        // Ca khai thác: 03:00 D -> 02:59 D+1
        const sched = f.scheduled || '';
        if (f.date === selectedDate) {
          if (sched < '03:00') return false;
        } else if (f.date === nextDateStr) {
          if (sched >= '03:00') return false;
        } else {
          return false;
        }

        const fDir = (f.direction || '').toUpperCase();
        const fType = (f.flight_type || '').toUpperCase();

        const matchDir = (fDir === currentDirection.toUpperCase());
        const matchType = (fType === currentType.toUpperCase());

        const matchSearch = !searchKey || 
          (f.flight_no && f.flight_no.toUpperCase().includes(searchKey)) ||
          (f.route && f.route.toUpperCase().includes(searchKey)) ||
          (f.destination_or_from && f.destination_or_from.toUpperCase().includes(searchKey));

        return matchDir && matchType && matchSearch;
      });

      // Sắp xếp Scheduled
      filtered.sort((a, b) => {
        const prioA = (a.date === selectedDate) ? 0 : 1;
        const prioB = (b.date === selectedDate) ? 0 : 1;
        if (prioA !== prioB) return prioA - prioB;
        return (a.scheduled || '99:99').localeCompare(b.scheduled || '99:99');
      });

      document.getElementById('flightCount').innerText = filtered.length;

      // CẬP NHẬT HEADER (FREEZE & HIGHLIGHT ĐẬM CHẤT VNA NAVY & GOLD)
      const thead = document.getElementById('flightsTableHead');
      let headerHtml = '';

      if (currentDirection === 'Departure') {
        headerHtml = `
          <tr class="bg-vna-dark text-white uppercase text-xs tracking-wider border-b-2 border-vna-gold font-mono">
            <th class="py-3 px-4 font-extrabold sticky top-0 bg-vna-dark z-20 text-yellow-300">FLT NO.</th>
            <th class="py-3 px-4 font-bold sticky top-0 bg-vna-dark z-20 text-white">DEST</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-vna-dark z-20 text-white">STD</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-vna-dark z-20 text-white">ETD</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-vna-dark z-20 text-white">GATE</th>
            <th class="py-3 px-4 font-extrabold text-center sticky top-0 bg-vna-dark z-20 text-yellow-300">STATUS</th>
          </tr>
        `;
      } else {
        headerHtml = `
          <tr class="bg-vna-dark text-white uppercase text-xs tracking-wider border-b-2 border-vna-gold font-mono">
            <th class="py-3 px-4 font-extrabold sticky top-0 bg-vna-dark z-20 text-yellow-300">FLT NO.</th>
            <th class="py-3 px-4 font-bold sticky top-0 bg-vna-dark z-20 text-white">FROM</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-vna-dark z-20 text-white">STA</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-vna-dark z-20 text-white">ETA</th>
            <th class="py-3 px-4 font-extrabold text-center sticky top-0 bg-vna-dark z-20 text-yellow-300">Flightradar24</th>
            <th class="py-3 px-4 font-bold text-center sticky top-0 bg-vna-dark z-20 text-white">BELT</th>
            <th class="py-3 px-4 font-extrabold text-center sticky top-0 bg-vna-dark z-20 text-yellow-300">STATUS</th>
          </tr>
        `;
      }
      thead.innerHTML = headerHtml;

      // Tìm chuyến bay tiêu điểm
      const nowDate = new Date();
      const currentHHMM = String(nowDate.getHours()).padStart(2, '0') + ':' + String(nowDate.getMinutes()).padStart(2, '0');
      const isLateNight = currentHHMM < '03:00';
      
      let targetRowIndex = -1;

      if (currentDirection === 'Arrival') {
        for (let i = 0; i < filtered.length; i++) {
          const st = getPriorityStatus(filtered[i]).toUpperCase();
          if (st.includes('LANDING') || st.includes('ARRIVING') || st.includes('APPROACH')) {
            targetRowIndex = i;
            break;
          }
        }
        if (targetRowIndex === -1) {
          for (let i = 0; i < filtered.length; i++) {
            const frEta = getIndependentFr24Eta(filtered[i]);
            if (frEta && frEta !== '--') {
              targetRowIndex = i;
              break;
            }
          }
        }
      }

      if (targetRowIndex === -1) {
        for (let i = 0; i < filtered.length; i++) {
          const f = filtered[i];
          if (!isLateNight && f.date === selectedDate && (f.scheduled || '') >= currentHHMM) {
            targetRowIndex = i;
            break;
          } else if (isLateNight && f.date === nextDateStr && (f.scheduled || '') >= currentHHMM) {
            targetRowIndex = i;
            break;
          }
        }
        if (targetRowIndex === -1 && filtered.length > 0) {
          targetRowIndex = 0;
        }
      }

      // RENDER DỮ LIỆU
      const tbody = document.getElementById('flightsTableBody');

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        document.getElementById('emptyMessage').classList.remove('hidden');
        return;
      }
      document.getElementById('emptyMessage').classList.add('hidden');

      let rowsHtml = '';
      filtered.forEach((f, idx) => {
        const isNextDayFlight = (f.date === nextDateStr);
        const isCurrentFocus = (idx === targetRowIndex);

        const finalStatus = getPriorityStatus(f);
        const remUpper = finalStatus.toUpperCase();
        const isBoarding = remUpper.includes('BOARDING');

        const flightNoClean = (f.flight_no || '').replace(/\s+/g, '');
        const cityName = f.route || f.destination_or_from || '--';

        // Phối màu sang trọng: hàng Boarding phủ ánh vàng sen VNA
        let trClass = "hover:bg-slate-50/90 transition-colors duration-150";
        if (isBoarding) {
          trClass = "vna-boarding-row font-medium";
        } else if (isCurrentFocus) {
          trClass = "bg-amber-50/50 border-l-4 border-l-vna-gold hover:bg-slate-50 transition";
        }

        const trId = isCurrentFocus ? 'id="currentFocusFlight"' : '';
        const timeBadge = isNextDayFlight 
          ? `<span class="text-[11px] text-sky-600 font-bold ml-1 font-mono">(+1)</span>` 
          : '';

        const independentEta = getIndependentFr24Eta(f);
        let fr24Cell = '';
        if (independentEta !== '--') {
          fr24Cell = `
            <div class="flex items-center justify-center space-x-1.5">
              <span class="font-mono font-bold text-sky-800 bg-sky-100 px-2.5 py-0.5 rounded-md border border-sky-300 text-xs shadow-2xs" title="Giờ dự đáp (ETA) độc lập từ Flightradar24">
                ${independentEta}
              </span>
              <a href="https://www.flightradar24.com/data/flights/${flightNoClean}" target="_blank" rel="noopener noreferrer" title="Xem radar" class="inline-flex items-center p-1 rounded text-yellow-500 hover:text-yellow-600 hover:bg-slate-100 transition">
                <i class="fa-solid fa-radar text-xs"></i>
              </a>
            </div>
          `;
        } else {
          fr24Cell = `
            <a href="https://www.flightradar24.com/data/flights/${flightNoClean}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center px-2 py-1 text-xs font-semibold rounded-md bg-slate-900 text-yellow-400 hover:bg-black transition shadow-xs font-mono">
              <i class="fa-solid fa-radar mr-1 text-[10px]"></i> Radar Live
            </a>
          `;
        }

        const statusBadgeHtml = formatVnaStatusBadge(finalStatus);

        if (currentDirection === 'Departure') {
          rowsHtml += `
            <tr ${trId} class="${trClass}">
              <td class="py-3 px-4 font-bold text-vna-blue font-mono tracking-wide whitespace-nowrap">${f.flight_no}</td>
              <td class="py-3 px-4 font-bold text-slate-800 whitespace-nowrap">${cityName}</td>
              <td class="py-3 px-4 text-center font-mono font-bold text-slate-800 whitespace-nowrap">${f.scheduled || '--:--'}${timeBadge}</td>
              <td class="py-3 px-4 text-center font-mono font-semibold ${f.estimated && f.estimated !== f.scheduled ? 'text-amber-600 font-bold' : 'text-slate-600'} whitespace-nowrap">${f.estimated || '--:--'}</td>
              <td class="py-3 px-4 text-center whitespace-nowrap">
                <span class="px-2.5 py-1 bg-slate-50 font-bold font-mono text-xs rounded-md border border-slate-200 shadow-2xs">${f.gate || '--'}</span>
              </td>
              <td class="py-3 px-4 text-center whitespace-nowrap">${statusBadgeHtml}</td>
            </tr>
          `;
        } else {
          rowsHtml += `
            <tr ${trId} class="${trClass}">
              <td class="py-3 px-4 font-bold text-vna-blue font-mono tracking-wide whitespace-nowrap">${f.flight_no}</td>
              <td class="py-3 px-4 font-bold text-slate-800 whitespace-nowrap">${cityName}</td>
              <td class="py-3 px-4 text-center font-mono font-bold text-slate-800 whitespace-nowrap">${f.scheduled || '--:--'}${timeBadge}</td>
              <td class="py-3 px-4 text-center font-mono font-semibold ${f.estimated && f.estimated !== f.scheduled ? 'text-amber-600 font-bold' : 'text-slate-600'} whitespace-nowrap">${f.estimated || '--:--'}</td>
              <td class="py-3 px-4 text-center whitespace-nowrap">${fr24Cell}</td>
              <td class="py-3 px-4 text-center whitespace-nowrap">
                <span class="px-2.5 py-1 bg-slate-50 font-bold font-mono text-xs rounded-md border border-slate-200 shadow-2xs">${f.belt || '--'}</span>
              </td>
              <td class="py-3 px-4 text-center whitespace-nowrap">${statusBadgeHtml}</td>
            </tr>
          `;
        }
      });

      tbody.innerHTML = rowsHtml;

      if (shouldScroll && isInitialLoad) {
        isInitialLoad = false;
        setTimeout(() => {
          const focusRow = document.getElementById('currentFocusFlight');
          if (focusRow) {
            focusRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 300);
      }
    }

    datePicker.addEventListener('change', (e) => {
      isInitialLoad = true;
      localStorage.setItem('vna_selected_date', e.target.value);
      listenToFlights(e.target.value);
    });

    document.getElementById('searchInput').addEventListener('input', () => renderFlights(false));

    window.setDirection = (dir) => {
      if (currentDirection === dir) return;
      currentDirection = dir;
      localStorage.setItem('vna_selected_bound', dir);
      updateButtonUI();
      renderFlights(false);
    };

    window.setType = (type) => {
      if (currentType === type) return;
      currentType = type;
      localStorage.setItem('vna_selected_type', type);
      updateButtonUI();
      renderFlights(false);
    };

    // 1. Nút Cập nhật hôm nay (VIAGS tổng)
    window.triggerRefreshToday = async (isSilent = false) => {
      const btn = document.getElementById('btnRefresh');
      const icon = document.getElementById('refreshIcon');
      const text = document.getElementById('refreshText');

      if (btn.disabled || isTodayUpdating) return;

      isTodayUpdating = true;
      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-not-allowed');
      icon.classList.add('fa-spin');
      text.innerText = 'Đang gửi...';

      try {
        const res = await fetch('/api/refresh', { method: 'POST' });
        const data = await res.json();

        if (res.ok) {
          let countdown = 80;
          const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
              text.innerText = `VIAGS... (${countdown}s)`;
            } else {
              clearInterval(timer);
              btn.disabled = false;
              isTodayUpdating = false;
              btn.classList.remove('opacity-75', 'cursor-not-allowed');
              icon.classList.remove('fa-spin');
              text.innerText = 'VIAGS (D)';
            }
          }, 1000);
        } else {
          if (!isSilent) alert('Lỗi: ' + (data.error || 'Không thể gửi lệnh'));
          btn.disabled = false;
          isTodayUpdating = false;
          btn.classList.remove('opacity-75', 'cursor-not-allowed');
          icon.classList.remove('fa-spin');
          text.innerText = 'VIAGS (D)';
        }
      } catch (err) {
        if (!isSilent) alert('Lỗi kết nối máy chủ!');
        btn.disabled = false;
        isTodayUpdating = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        icon.classList.remove('fa-spin');
        text.innerText = 'VIAGS (D)';
      }
    };

    // 2. Nút Cập nhật độc lập Flightradar24 (Chu kỳ 3 phút)
    window.triggerRefreshFR24 = async (isSilent = false) => {
      const btn = document.getElementById('btnRefreshFR24');
      const icon = document.getElementById('refreshIconFR24');
      const text = document.getElementById('refreshTextFR24');

      if (btn.disabled || isFR24Updating) return;

      isFR24Updating = true;
      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-not-allowed');
      icon.classList.add('fa-spin');
      text.innerText = 'Đang gửi...';

      try {
        const res = await fetch('/api/refresh-fr24', { method: 'POST' });
        const data = await res.json();

        if (res.ok) {
          let countdown = 25;
          const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
              text.innerText = `FR24... (${countdown}s)`;
            } else {
              clearInterval(timer);
              btn.disabled = false;
              isFR24Updating = false;
              btn.classList.remove('opacity-75', 'cursor-not-allowed');
              icon.classList.remove('fa-spin');
              text.innerText = 'RADAR FR24';
            }
          }, 1000);
        } else {
          if (!isSilent) alert('Lỗi: ' + (data.error || 'Không thể gửi lệnh'));
          btn.disabled = false;
          isFR24Updating = false;
          btn.classList.remove('opacity-75', 'cursor-not-allowed');
          icon.classList.remove('fa-spin');
          text.innerText = 'RADAR FR24';
        }
      } catch (err) {
        if (!isSilent) alert('Lỗi kết nối máy chủ!');
        btn.disabled = false;
        isFR24Updating = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        icon.classList.remove('fa-spin');
        text.innerText = 'RADAR FR24';
      }
    };

    // 3. Nút Cập nhật riêng cột STATUS (Chu kỳ 1 phút)
    window.triggerRefreshStatus = async (isSilent = false) => {
      const btn = document.getElementById('btnRefreshStatus');
      const icon = document.getElementById('refreshIconStatus');
      const text = document.getElementById('refreshTextStatus');

      if (btn.disabled || isStatusUpdating) return;

      isStatusUpdating = true;
      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-not-allowed');
      icon.classList.add('fa-spin');
      text.innerText = 'Đang gửi...';

      try {
        const res = await fetch('/api/refresh-status', { method: 'POST' });
        const data = await res.json();

        if (res.ok) {
          let countdown = 35;
          const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
              text.innerText = `STATUS (${countdown}s)`;
            } else {
              clearInterval(timer);
              btn.disabled = false;
              isStatusUpdating = false;
              btn.classList.remove('opacity-75', 'cursor-not-allowed');
              icon.classList.remove('fa-spin');
              text.innerText = 'STATUS (1m)';
            }
          }, 1000);
        } else {
          if (!isSilent) alert('Lỗi: ' + (data.error || 'Không thể gửi lệnh'));
          btn.disabled = false;
          isStatusUpdating = false;
          btn.classList.remove('opacity-75', 'cursor-not-allowed');
          icon.classList.remove('fa-spin');
          text.innerText = 'STATUS (1m)';
        }
      } catch (err) {
        if (!isSilent) alert('Lỗi kết nối máy chủ!');
        btn.disabled = false;
        isStatusUpdating = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        icon.classList.remove('fa-spin');
        text.innerText = 'STATUS (1m)';
      }
    };

    // 4. AUTO-PILOT ĐIỀU PHỐI 3 NHỊP: STATUS 1 PHÚT | FR24 3 PHÚT | VIAGS 10 PHÚT
    let autoSec = 0;

    function updateAutoPilotUI() {
      const btn = document.getElementById('btnAutoPilot');
      const dot = document.getElementById('autoPilotDot');
      const txt = document.getElementById('autoPilotText');

      if (autoPilotEnabled) {
        btn.className = "inline-flex items-center px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/30 active:scale-95 transition cursor-pointer font-mono";
        dot.className = "w-2 h-2 mr-2 bg-emerald-400 rounded-full animate-pulse shadow-[0_0_8px_#34d399]";
        txt.innerText = "Tự động: BẬT";
      } else {
        btn.className = "inline-flex items-center px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-700/50 text-slate-400 border border-slate-600 hover:bg-slate-700 active:scale-95 transition cursor-pointer font-mono";
        dot.className = "w-2 h-2 mr-2 bg-slate-400 rounded-full";
        txt.innerText = "Tự động: TẮT";
      }
    }

    window.toggleAutoPilot = () => {
      autoPilotEnabled = !autoPilotEnabled;
      localStorage.setItem('vna_autopilot_enabled', autoPilotEnabled ? 'true' : 'false');
      updateAutoPilotUI();
    };

    // Bộ đếm nhịp tự động (Tách lệch giây tuyệt đối, không trùng thời điểm)
    setInterval(() => {
      if (!autoPilotEnabled) return;
      autoSec++;

      // Nhịp 1: Mỗi 1 phút (60 giây) -> Tự động quét STATUS ngày hôm nay
      if (autoSec % 60 === 0) {
        if (!isStatusUpdating) {
          window.triggerRefreshStatus(true);
        }
      }

      // Nhịp 2: Mỗi 3 phút (180 giây, lệch 20 giây) -> Tự động quét FR24
      if ((autoSec + 20) % 180 === 0) {
        if (!isFR24Updating) {
          window.triggerRefreshFR24(true);
        }
      }

      // Nhịp 3: Mỗi 10 phút (600 giây, lệch 40 giây) -> Tự động quét VIAGS tổng
      if ((autoSec + 40) % 600 === 0) {
        if (!isTodayUpdating) {
          window.triggerRefreshToday(true);
        }
      }
    }, 1000);

    updateButtonUI();
    updateAutoPilotUI();
    listenToFlights(rememberedDate);
  </script>
</body>
</html>
