name: Auto Scrape VIAGS Flights

on:
  schedule:
    # Chạy tự động định kỳ mỗi giờ
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Chế độ cào (today_only hoặc both_days)'
        required: false
        default: 'both_days'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright firebase-admin pytz
          playwright install chromium

      - name: Run Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SCRAPE_MODE: ${{ github.event.inputs.mode || 'both_days' }}
        run: |
          python scraper.py
