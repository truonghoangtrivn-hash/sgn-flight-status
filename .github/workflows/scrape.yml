name: Auto Scrape VIAGS Flights

on:
  schedule:
    # Chạy tự động định kỳ ngầm mỗi 20 phút kể cả khi tắt máy
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Chế độ cào (today_only, both_days, fr24_only, status_only)'
        required: false
        default: 'both_days'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (Siêu tốc khi quét FR24)
        run: |
          pip install playwright firebase-admin pytz
          if [ "${{ github.event.inputs.mode }}" != "fr24_only" ]; then
            playwright install chromium
          fi

      - name: Run Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SCRAPE_MODE: ${{ github.event.inputs.mode || 'scheduled_auto' }}
        run: |
          python scraper.py
