name: Auto Scrape VIAGS Flights

on:
  schedule:
    # Chạy tự động định kỳ ngầm mỗi 20 phút kể cả khi tắt máy
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Chế độ cào (status_only, fr24_only, today_only, both_days)'
        required: false
        default: 'status_only'

# KHÓA CHỐNG XUNG ĐỘT & CHỐNG KẸT HÀNG ĐỢI:
concurrency:
  group: vna-sgn-scraper-${{ github.event.inputs.mode || 'scheduled_auto' }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright Chromium Browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-chromium-v2

      - name: Install dependencies
        run: |
          pip install playwright firebase-admin pytz
          if [ "${{ github.event.inputs.mode }}" != "fr24_only" ]; then
            playwright install chromium
          fi

      - name: Run Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SCRAPE_MODE: ${{ github.event.inputs.mode || 'scheduled_auto' }}
        run: |
          python scraper.py
